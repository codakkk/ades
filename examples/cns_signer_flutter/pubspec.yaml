name: cns_signer_example
description: "Sample Flutter desktop app: sign a file with a CNS smart card (ades_pkcs11)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  ades:
    path: ../../packages/ades
  ades_pkcs11:
    path: ../../packages/ades_pkcs11
  file_selector: ^1.0.3

# This app is deliberately NOT a member of the root pub workspace (the
# workspace stays Flutter-free, roadmap constraint 3). `ades_pkcs11` declares
# `ades: any`, so the in-repo core is supplied by path here.
dependency_overrides:
  ades:
    path: ../../packages/ades

dev_dependencies:
  ades_soft:
    path: ../../packages/ades_soft
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
