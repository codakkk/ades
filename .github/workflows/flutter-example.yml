name: Flutter example
on:
  pull_request:
  push:
    branches: [main, mvp]

permissions:
  contents: read

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/cns_signer_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux
